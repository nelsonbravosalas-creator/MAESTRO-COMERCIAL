name: Resumen Comercial Ejecutivo

on:
  schedule:
    # Lunes, Miércoles y Viernes a las 08:30 AM (Chile UTC-3 -> 11:30 UTC)
    - cron: '30 11 * * 1,3,5'
  workflow_dispatch: {} # Permite ejecución manual en cualquier momento desde GitHub

jobs:
  commercial-summary:
    name: Generar y Enviar Resumen Comercial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - working-directory: backend
        run: npm ci

      - name: Verificar Secretos Requeridos
        run: |
          if [ -z "${{ secrets.PROD_DATABASE_URL }}" ]; then
            echo "::error::Falta el secret PROD_DATABASE_URL en GitHub Secrets."
            exit 1
          fi

      - name: Ejecutar Bot de Resumen Comercial
        working-directory: backend
        run: npm run report:weekly
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_SECURE: 'true'
          MAIL_FROM: ${{ secrets.SMTP_USER }}
